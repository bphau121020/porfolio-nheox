<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="HandheldFriendly" content="True">
    <meta name="MobileOptimized" content="320">
    <meta name="format-detection" content="telephone=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!--[if IE]><meta http-equiv="cleartype" content="on"><![endif]-->
    <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welcome to our website. We provide the best services.">
    <meta name="keywords" content="homepage, services, best">
    <meta name="theme-color" content="#ffffff">
    <!-- SEO & Open Graph Meta Tags-->
    <link rel="canonical" href="undefined.">
    <meta property="og:site_name">
    <meta property="og:title" content="My Website | Home">
    <meta property="og:description" content="Welcome to our website. We provide the best services.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="undefined.">
    <meta property="og:image" content="undefined/img/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <title>My Website | Home</title>
    <!-- Resource Hints for Performance-->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.min.css">
    <link rel="stylesheet" href="./css/top.css">
  </head>
  <body>
    <div class="container">
      <header class="header-common hidden">
        <div class="header-common__viewport"> 
          <div class="header-common__logo"> </div>
          <div class="header-common__navigation"> 
            <nav class="navigation-common"> 
              <ul class="navigation-common__list"> 
                <li class="navigation-common__item"> <a href="#"></a></li>
              </ul>
            </nav>
          </div>
        </div>
        <div class="hambuger-common">
          <div class="hambuger-common__wrapper"> 
            <div class="hambuger-common__line"> </div>
            <div class="hambuger-common__line"> </div>
            <div class="hambuger-common__line"> </div>
          </div>
        </div>
      </header>
      <div class="overlay-common"></div>
      <main>
        <section class="hero">
          <div class="hero__inner">
            <h1 class="hero__title">Welcome to My Website</h1>
            <p class="hero__desc">We provide modern and optimized solutions.</p>
            <picture>
              <source srcset="./img/top/hero-banner.webp" type="image/webp"><img class="hero__img" src="./img/top/hero-banner.jpg" alt="Hero Banner" loading="lazy" decoding="async">
            </picture>
          </div>
        </section>
        <section class="features">
          <div class="features__inner">
            <h2 class="features__title">Our Features</h2>
            <ul class="features__list">
              <li class="features__item">
                <picture>
                  <source srcset="./img/common/icon-speed.webp" type="image/webp"><img class="features__icon" src="./img/common/icon-speed.png" alt="Speed Icon" loading="lazy" decoding="async">
                </picture>
                <h3>Fast Performance</h3>
                <p>Optimized for PageSpeed Insights with WebP and deferred scripts.</p>
              </li>
              <li class="features__item">
                <picture>
                  <source srcset="./img/common/icon-seo.webp" type="image/webp"><img class="features__icon" src="./img/common/icon-seo.png" alt="SEO Icon" loading="lazy" decoding="async">
                </picture>
                <h3>SEO Friendly</h3>
                <p>Built-in support for Open Graph, Twitter Cards, and semantic HTML.</p>
              </li>
            </ul>
          </div>
        </section>
      </main>
      <footer class="footer-common hidden"></footer>
    </div>
    <!-- Deferred Scripts for PageSpeed-->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.min.js"></script>
    <script defer src="./js/scripts.js"></script>
  </body>
</html>
